language: pt_PT
debug: false

economy:
  mode: auto
  priority: ["MultiBank", "Vault"]

bounty:
  min-amount: 500
  max-amount-per-contribution: 1000000
  max-total-per-target: 10000000
  tax-rate: 0.10
  allow-offline-targets: false
  broadcast-threshold: 5000
  allow-same-faction: false
  cancel-blocked-in-combat: true

hitman:
  stale-negotiation-hours: 24
  anonymous-broadcast: true
  hitman-killed-client-percent: 85
  defaults:
    min-price: 100000
    min-hours: 1
    max-hours: 168
    max-concurrent: 3

damage-tracking:
  valid-kill-window-seconds: 300
  suicide-window-seconds: 150
  hit-notification-cooldown-seconds: 10

anti-exploit:
  suspicious-death-threshold: 7
  suspicious-death-window-minutes: 60
  reveal-deathchest-coords: true

notifications:
  bounty-placed-broadcast: true
  bounty-claimed-broadcast: true
  target-bossbar: true
  target-bossbar-color: RED
  hitman-target-bossbar: true
  hitman-target-bossbar-color: PURPLE

sounds:
  bounty-placed: "minecraft:entity.experience_orb.pickup"
  bounty-claimed: "minecraft:ui.toast.challenge_complete"
  hit-bounty-target: "minecraft:block.note_block.pling"
  coords-revealed: "minecraft:entity.elder_guardian.curse"
  contract-proposed: "minecraft:entity.evoker.prepare_attack"
  contract-accepted: "minecraft:ui.toast.challenge_complete"
  contract-completed: "minecraft:ui.toast.challenge_complete"
  contract-cancelled: "minecraft:block.anvil.land"
  counter-offer: "minecraft:block.note_block.pling"

# ─────────────────────────────────────────────────────────────────────────────
# GUI Layout Configuration
# All sizes must be multiples of 9 (9, 18, 27, 36, 45, 54).
# Slot numbers are 0-indexed. Change at your own risk — invalid slots will
# cause items to silently not appear.
# ─────────────────────────────────────────────────────────────────────────────
